apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mvp-api-test
  annotations:
    run.googleapis.com/launch-stage: BETA   # required for multi-container
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"   # scale-to-zero
        autoscaling.knative.dev/maxScale: "3"
        # Admin must not start until the API has finished EnsureDeleted/Created
        # and is serving — otherwise both would race against the same Postgres.
        run.googleapis.com/container-dependencies: '{"mvp-admin": ["mvp-api"]}'
    spec:
      containers:

        # -- Ingress container: the .NET API ------------------------------------
        - name: mvp-api
          image: IMAGE_API_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: synapse-test
            - name: DB_USER
              value: synapse-user
            - name: DB_PASSWORD
              value: synapse-test-pw
            - name: ApiKey
              value: dev-api-key-synapse-2026
            - name: ADMIN_INTERNAL_URL
              value: "http://127.0.0.1:8081"
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20      # increased to give postgres more headroom
            periodSeconds: 5
            failureThreshold: 10

        # -- Sidecar container: UI-Admin ----------------------------------------
        # Reachable through the API container's YARP forwarder for any path
        # outside /api/* and /health. Shares the postgres sidecar via localhost.
        - name: mvp-admin
          image: IMAGE_ADMIN_PLACEHOLDER
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8081
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: synapse-test
            - name: DB_USER
              value: synapse-user
            - name: DB_PASSWORD
              value: synapse-test-pw
            - name: ApiBaseUrl
              value: "http://127.0.0.1:8080"
            - name: ApiKey
              value: dev-api-key-synapse-2026
            - name: AllowedHosts
              value: "*"
            - name: SystemAdmin__Email
              value: admin@synapse.local
            - name: SystemAdmin__Password
              value: Admin1234!
            - name: Vite__Base
              value: /dist/
          resources:
            limits:
              memory: 512Mi
              cpu: "1"

        # -- Sidecar container: PostgreSQL --------------------------------------
        - name: postgres
          image: pgvector/pgvector:pg15
          env:
            - name: POSTGRES_DB
              value: synapse-test
            - name: POSTGRES_USER
              value: synapse-user
            - name: POSTGRES_PASSWORD
              value: synapse-test-pw
            - name: PGDATA
              value: /tmp/pgdata
          resources:
            limits:
              # /tmp is tmpfs and counts against this limit, so PGDATA eats
              # into working memory. 256Mi caused 30s+ query times under
              # combined API+admin load; 1Gi gives postgres headroom.
              memory: 1Gi
              cpu: "1"
          startupProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10