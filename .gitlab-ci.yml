# Synapse CI/CD Pipeline
# development branch: test environment op Cloud Run (automatisch)
# main branch: productie MIG rolling deploy (handmatig)

image: docker:27

services:
  - docker:27-dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_API:   "gcr.io/${PROJECT_ID}/mvp-app"
  IMAGE_UI:    "gcr.io/${PROJECT_ID}/mvp-ui"
  IMAGE_ADMIN: "gcr.io/${PROJECT_ID}/mvp-admin"
  IMAGE_NGINX: "gcr.io/${PROJECT_ID}/mvp-nginx"
  IMAGE_TAG: "${CI_COMMIT_SHA}"
  ZONE:      "europe-west1-b"

stages:
  - build
  - scan
  - push
  - sign
  - deploy

.gcr_login: &gcr_login
  before_script:
    - echo "${GCR_SERVICE_ACCOUNT_KEY}" | base64 -d | docker login -u _json_key --password-stdin https://gcr.io

build-nginx:
  stage: build
  <<: *gcr_login
  script:
    - docker build --provenance=false -t "${IMAGE_NGINX}:${IMAGE_TAG}" -f Dockerfile.nginx .
    - docker save "${IMAGE_NGINX}:${IMAGE_TAG}" | gzip > nginx-image.tar.gz
  artifacts:
    paths:
      - nginx-image.tar.gz
    expire_in: 1 hour
  only:
    - development

build-api:
  stage: build
  <<: *gcr_login
  script:
    - docker build --provenance=false -t "${IMAGE_API}:${IMAGE_TAG}" .
    - docker save "${IMAGE_API}:${IMAGE_TAG}" | gzip > api-image.tar.gz
  artifacts:
    paths:
      - api-image.tar.gz
    expire_in: 1 hour
  only:
    - development
    - main
    - release/staging

build-ui:
  stage: build
  <<: *gcr_login
  script:
    - docker build --provenance=false -t "${IMAGE_UI}:${IMAGE_TAG}" -f Dockerfile.ui-user .
    - docker save "${IMAGE_UI}:${IMAGE_TAG}" | gzip > ui-image.tar.gz
  artifacts:
    paths:
      - ui-image.tar.gz
    expire_in: 1 hour
  only:
    - development
    - main
    - release/staging

build-admin:
  stage: build
  <<: *gcr_login
  script:
    - docker build --provenance=false -t "${IMAGE_ADMIN}:${IMAGE_TAG}" -f Dockerfile.ui-admin .
    - docker save "${IMAGE_ADMIN}:${IMAGE_TAG}" | gzip > admin-image.tar.gz
  artifacts:
    paths:
      - admin-image.tar.gz
    expire_in: 1 hour
  only:
    - development
    - main
    - release/staging

scan-api:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --format spdx-json --output sbom-api.json --input api-image.tar.gz
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --input api-image.tar.gz
  artifacts:
    paths:
      - sbom-api.json
    when: always
    expire_in: 1 week
  allow_failure: false
  only:
    - development
    - main
    - release/staging

scan-ui:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --format spdx-json --output sbom-ui.json --input ui-image.tar.gz
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --input ui-image.tar.gz
  artifacts:
    paths:
      - sbom-ui.json
    when: always
    expire_in: 1 week
  allow_failure: false
  only:
    - development
    - main
    - release/staging

scan-admin:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --format spdx-json --output sbom-admin.json --input admin-image.tar.gz
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --input admin-image.tar.gz
  artifacts:
    paths:
      - sbom-admin.json
    when: always
    expire_in: 1 week
  allow_failure: false
  only:
    - development
    - main
    - release/staging

scan-nginx:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --format spdx-json --output sbom-nginx.json --input nginx-image.tar.gz
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --input nginx-image.tar.gz
  artifacts:
    paths:
      - sbom-nginx.json
    when: always
    expire_in: 1 week
  allow_failure: false
  only:
    - development

push-test:
  stage: push
  <<: *gcr_login
  script:
    - docker load < api-image.tar.gz
    - docker load < ui-image.tar.gz
    - docker load < admin-image.tar.gz
    - docker load < nginx-image.tar.gz
    - docker push "${IMAGE_API}:${IMAGE_TAG}"
    - docker push "${IMAGE_UI}:${IMAGE_TAG}"
    - docker push "${IMAGE_ADMIN}:${IMAGE_TAG}"
    - docker push "${IMAGE_NGINX}:${IMAGE_TAG}"
    # test-latest tag zodat de test-MIG startup scripts de juiste image pullen
    - docker tag "${IMAGE_API}:${IMAGE_TAG}"   "${IMAGE_API}:test-latest"
    - docker tag "${IMAGE_UI}:${IMAGE_TAG}"    "${IMAGE_UI}:test-latest"
    - docker tag "${IMAGE_ADMIN}:${IMAGE_TAG}" "${IMAGE_ADMIN}:test-latest"
    - docker push "${IMAGE_API}:test-latest"
    - docker push "${IMAGE_UI}:test-latest"
    - docker push "${IMAGE_ADMIN}:test-latest"
  only:
    - development #reverse

push-prod:
  stage: push
  <<: *gcr_login
  script:
    - docker load < api-image.tar.gz
    - docker load < ui-image.tar.gz
    - docker load < admin-image.tar.gz
    - docker push "${IMAGE_API}:${IMAGE_TAG}"
    - docker push "${IMAGE_UI}:${IMAGE_TAG}"
    - docker push "${IMAGE_ADMIN}:${IMAGE_TAG}"
    - docker tag "${IMAGE_API}:${IMAGE_TAG}"   "${IMAGE_API}:latest"
    - docker tag "${IMAGE_UI}:${IMAGE_TAG}"    "${IMAGE_UI}:latest"
    - docker tag "${IMAGE_ADMIN}:${IMAGE_TAG}" "${IMAGE_ADMIN}:latest"
    - docker push "${IMAGE_API}:latest"
    - docker push "${IMAGE_UI}:latest"
    - docker push "${IMAGE_ADMIN}:latest"
  only:
    - main #reverse
    - release/staging

sign-prod:
  stage: sign
  image: alpine:latest
  before_script:
    - apk add --no-cache curl docker-cli
    - curl -sL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    - echo "${GCR_SERVICE_ACCOUNT_KEY}" | base64 -d | docker login -u _json_key --password-stdin https://gcr.io
  script:
    - COSIGN_PASSWORD="${COSIGN_PASSWORD}" cosign sign --key "${COSIGN_PRIVATE_KEY}" --yes "${IMAGE_API}:${IMAGE_TAG}"
    - COSIGN_PASSWORD="${COSIGN_PASSWORD}" cosign sign --key "${COSIGN_PRIVATE_KEY}" --yes "${IMAGE_UI}:${IMAGE_TAG}"
    - COSIGN_PASSWORD="${COSIGN_PASSWORD}" cosign sign --key "${COSIGN_PRIVATE_KEY}" --yes "${IMAGE_ADMIN}:${IMAGE_TAG}"
  only:
    - main
    - release/staging

deploy-test:
  stage: deploy
  image: google/cloud-sdk:latest
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/667656673282/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider
  before_script:
    - echo "${GCP_ID_TOKEN}" > /tmp/gcp_token
    - gcloud auth login --cred-file=gcp-wif-test.json
    - gcloud config set project "${PROJECT_ID}"
  script:
    # Rolling replace op de test-MIGs (zero-downtime, --max-surge=1 houdt altijd 1 actief)
    # Vereist: bootstrap.sh test is al eens uitgevoerd zodat de MIGs bestaan.
    - |
      gcloud compute instance-groups managed rolling-action replace synapse-test-api-mig \
        --zone="${ZONE}" --max-unavailable=0 --max-surge=1
      gcloud compute instance-groups managed rolling-action replace synapse-test-ui-mig \
        --zone="${ZONE}" --max-unavailable=0 --max-surge=1
      gcloud compute instance-groups managed rolling-action replace synapse-test-admin-mig \
        --zone="${ZONE}" --max-unavailable=0 --max-surge=1
      gcloud compute instance-groups managed wait-until synapse-test-api-mig   --stable --zone="${ZONE}"
      gcloud compute instance-groups managed wait-until synapse-test-ui-mig    --stable --zone="${ZONE}"
      gcloud compute instance-groups managed wait-until synapse-test-admin-mig --stable --zone="${ZONE}"
  only:
    - development #reverse
  environment:
    name: test

deploy-production:
  stage: deploy
  image: google/cloud-sdk:latest
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/667656673282/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider
  before_script:
      - echo "${GCP_ID_TOKEN}" > /tmp/gcp_token
      - gcloud auth login --cred-file=gcp-wif-prod.json
      - gcloud config set project "${PROJECT_ID}"
  script:
    - |
      gcloud compute instance-groups managed rolling-action replace synapse-prod-api-mig   --zone="${ZONE}" --max-unavailable=1 --max-surge=1
      gcloud compute instance-groups managed rolling-action replace synapse-prod-ui-mig    --zone="${ZONE}" --max-unavailable=1 --max-surge=1
      gcloud compute instance-groups managed rolling-action replace synapse-prod-admin-mig --zone="${ZONE}" --max-unavailable=1 --max-surge=1
      gcloud compute instance-groups managed wait-until synapse-prod-api-mig   --stable --zone="${ZONE}"
      gcloud compute instance-groups managed wait-until synapse-prod-ui-mig    --stable --zone="${ZONE}"
      gcloud compute instance-groups managed wait-until synapse-prod-admin-mig --stable --zone="${ZONE}"
  only:
    - main #reverse
    - release/staging
  when: manual
  environment:
    name: production
    